# Builds the mod's .hmod package and uploads it to a draft GitHub release.
#
# Runs only on a push to the `build` branch (e.g. `git push origin main:build`): unit tests,
# `cargo horizon-mod check`, `cargo horizon-mod build`, then the package uploaded to the draft
# release `v<version>` (`version` in horizon-mod.toml), with its SHA-256 for the registry entry.
# Each push replaces the draft's files and moves it to the new commit. Publish the draft by hand
# when it's ready; a published release is never changed.
#
# Cached: the cargo-horizon-mod tool (slow to build), the pinned SDK, and Cargo's
# registry and build output.

name: Build mod

on:
  push:
    branches: [build]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Horizon commit the registry's reviewers check with; the tool is built from it.
  REGISTRY_REV_URL: https://raw.githubusercontent.com/horizon-rust/horizon-mods/main/.github/horizon-rev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the mod's id, version and pins
        id: mod
        run: |
          manifest=horizon-mod.toml
          id=$(sed -n 's/^id = "\(.*\)"$/\1/p' "$manifest" | head -1)
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -1)
          pin=$(sed -n '/^\[native\]/,/^\[/ s/^horizon = "\(.*\)"$/\1/p' "$manifest" | head -1)
          game=$(sed -n '/^\[native\]/,/^\[/ s/^game = "\(.*\)"$/\1/p' "$manifest" | head -1)
          mixins=$(sed -n '/^\[native\]/,/^\[/ s/^mixins = "\(.*\)"$/\1/p' "$manifest" | head -1)
          tool_rev=$(curl -fsSL "$REGISTRY_REV_URL" | tr -d '[:space:]' || true)
          if ! [[ "$tool_rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::Couldn't read the registry's Horizon commit; building the tool from the mod's pin instead."
            tool_rev=$pin
          fi
          for name in id version pin game mixins tool_rev; do
            [ -n "${!name}" ] || { echo "::error::$name missing from $manifest"; exit 1; }
            echo "$name=${!name}" >> "$GITHUB_OUTPUT"
          done
          echo "Mod $id $version, pinned to Horizon $pin (game $game); tool from Horizon $tool_rev"

      - name: Install Rust to build the tool
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache the cargo-horizon-mod tool
        id: tool-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-horizon-mod
          key: cargo-horizon-mod-${{ runner.os }}-${{ steps.mod.outputs.tool_rev }}

      - name: Install cargo-horizon-mod
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/horizon-rust/horizon \
            --rev "${{ steps.mod.outputs.tool_rev }}" cargo-horizon-mod

      - name: Cache the pinned SDK
        uses: actions/cache@v4
        with:
          path: .horizon/sdk
          key: horizon-sdk-${{ runner.os }}-${{ steps.mod.outputs.pin }}

      - name: Fetch the pinned SDK
        # Any SDK command fetches it when missing; this one only searches the hook list.
        run: cargo horizon-mod hooks client_tick_pre > /dev/null

      - name: Use the SDK's Rust toolchain
        id: toolchain
        run: |
          rust=$(python3 -c 'import json; print(json.load(open(".horizon/sdk/sdk.json"))["toolchain"]["rust"])')
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          rustup toolchain install "$rust" --profile minimal --target wasm32-unknown-unknown
          rustup override set "$rust"
          rustc --version

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.toolchain.outputs.rust }}-${{ steps.mod.outputs.pin }}
          # The tool has its own cache above.
          cache-bin: "false"

      - name: Unit tests
        run: scripts/unit-tests.sh

      - name: Check the package
        run: cargo horizon-mod check

      - name: Build the package
        id: package
        run: |
          cargo horizon-mod build
          name="${{ steps.mod.outputs.id }}-${{ steps.mod.outputs.version }}.hmod"
          mkdir -p dist
          cp "target/horizon-mod/${{ steps.mod.outputs.id }}.hmod" "dist/$name"
          sha=$(sha256sum "dist/$name" | cut -d' ' -f1)
          echo "$sha  $name" > "dist/$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "### Built \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the package as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/
          if-no-files-found: error

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.mod.outputs.version }}
          NAME: ${{ steps.package.outputs.name }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          VERSION: ${{ steps.mod.outputs.version }}
          GAME: ${{ steps.mod.outputs.game }}
          PIN: ${{ steps.mod.outputs.pin }}
          MIXINS: ${{ steps.mod.outputs.mixins }}
        run: |
          cat > notes.md <<EOF
          Enemy Target Lock $VERSION for Horizon (game $GAME).

          Native source mod, pinned to Horizon \`$PIN\` and Horizon Mixins \`$MIXINS\`.

          | File | SHA-256 |
          |---|---|
          | \`$NAME\` | \`$SHA256\` |

          EOF

          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $TAG is already published. A published file never changes: bump the version."
              exit 1
            fi
            gh release upload "$TAG" "dist/$NAME" "dist/$NAME.sha256" --clobber
            gh release edit "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "dist/$NAME" "dist/$NAME.sha256" \
              --draft --target "$GITHUB_SHA" --title "Enemy Target Lock $VERSION" --notes-file notes.md
          fi
          echo "Uploaded to draft release $TAG: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
